name: Build Docker Archive

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Linux AMD64 Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          tags: audio-summary-agent:latest
          outputs: type=docker,dest=/tmp/audio-summary-agent.tar

      - name: Upload Docker archive
        uses: actions/upload-artifact@v4
        with:
          name: audio-summary-agent-docker
          path: /tmp/audio-summary-agent.tar
          retention-days: 7
